plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${mod_version}+${minecraft_version}"
group = maven_group
base.archivesName = mod_id

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
    runs {
        client {
            // ./gradlew runClient -Pselftest : headless smoke test used by CI
            if (providers.gradleProperty('selftest').isPresent()) {
                vmArg '-Dthe5zig.selftest=true'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Official Mojang names: same names as the Forge port, remapped to intermediary on build.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Optional: config button in the Mods menu. Not required at runtime.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    def props = [version: mod_version, minecraft_version: minecraft_version, loader_version: loader_version]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
