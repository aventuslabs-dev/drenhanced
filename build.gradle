plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.23,8.0)'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group
base.archivesName = mod_id

// Minecraft 1.21.x ships Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            // Mixin needs the config on the command line in dev; the jar manifest covers production.
            args "--mixin.config=${mod_id}.mixins.json"
        }
        register('client')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    def props = [mod_id: mod_id, mod_version: mod_version, minecraft_version: minecraft_version, forge_version: forge_version]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') { expand(props) }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'MixinConfigs': "${mod_id}.mixins.json",
            'Implementation-Title': mod_id,
            'Implementation-Version': mod_version
        )
    }
}
